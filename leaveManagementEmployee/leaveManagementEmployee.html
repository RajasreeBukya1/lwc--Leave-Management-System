<template>
    <lightning-card>

        <!-- Hide / Show Button -->
        <lightning-button variant="base" label={labelHideShow} onclick={handleClickButton}
            class="slds-var-m-around_medium">
        </lightning-button>

        <!-- Info Text -->
        <div class="slds-box slds-var-m-around_medium" if:true={isButtonClicked}>
            Leave is earned by an employee and granted by employer to take time off from work.
            The employee is free to avail this leave in accordance with the company policy.
        </div>

        <!-- Button Group -->
        <lightning-button-group class="slds-align_absolute-center">
            <lightning-button label="Apply" onclick={handleApplyLeave}></lightning-button>
            <lightning-button label="Pending" onclick={handlePendingLeave}></lightning-button>
            <lightning-button label="History" onclick={handleLeaveHistory}></lightning-button>
        </lightning-button-group>
        <br/>

        <!-- APPLY LEAVE MODAL -->
        <template if:true={isApplyLeave}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">

                    <button onclick={handleClose}
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse">
                        </lightning-icon>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>

                    <div class="slds-modal__header">
                        <h1 class="slds-modal__title">Apply Leave</h1>
                    </div>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form object-api-name="Leave_Management__c" onsuccess={handleSave}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field field-name="User__c"></lightning-input-field>
                            <lightning-input-field field-name="From_date__c"></lightning-input-field>
                            <lightning-input-field field-name="To_date__c"></lightning-input-field>
                            <lightning-input-field field-name="Type_of_Leave__c"></lightning-input-field>
                            <lightning-input-field field-name="Reason__c"></lightning-input-field>
                            <lightning-input-field field-name="Status__c"></lightning-input-field>
                            <lightning-input-field field-name="No_of_days__c"></lightning-input-field>

                            <div class="slds-align_absolute-center">
                                <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                                <lightning-button variant="neutral" label="Cancel" onclick={handleClose}>
                                </lightning-button>
                            </div>

                        </lightning-record-edit-form>
                    </div>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- PENDING LEAVES TABLE -->
        <template if:true={isPendingLeave}>
            <lightning-datatable key-field="Id" data={dataList} columns={columnsList} hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>

        <!-- HISTORY TABLE -->
        <template if:true={isLeaveHistory}>
            <lightning-datatable key-field="Id" data={dataList} columns={columnsList} hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>

        <!-- EDIT MODAL -->
        <template if:true={isEdit}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">

                    <button onclick={handleClose}
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse">
                        <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse">
                        </lightning-icon>
                        <span class="slds-assistive-text">Cancel and close</span>
                    </button>

                    <div class="slds-modal__header">
                        <h1 class="slds-modal__title">Edit Leave</h1>
                    </div>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form object-api-name="Leave_Management__c" record-id={recordId} onsuccess={handleSave}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field field-name="User__c"></lightning-input-field>
                            <lightning-input-field field-name="From_date__c"></lightning-input-field>
                            <lightning-input-field field-name="To_date__c"></lightning-input-field>
                            <lightning-input-field field-name="Type_of_Leave__c"></lightning-input-field>
                            <lightning-input-field field-name="Reason__c"></lightning-input-field>
                            <lightning-input-field field-name="Status__c"></lightning-input-field>
                            <lightning-input-field field-name="No_of_days__c"></lightning-input-field>
                            <div class="slds-align_absolute-center">
                                <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                                <lightning-button variant="neutral" label="Cancel" onclick={handleClose}>
                                </lightning-button>
                            </div>

                        </lightning-record-edit-form>
                    </div>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
